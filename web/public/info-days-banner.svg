<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Info Days - 3ème édition</title>
  <desc id="desc">Horizontal event banner for Info Days at ENSA Agadir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080719"/>
      <stop offset="0.55" stop-color="#171044"/>
      <stop offset="1" stop-color="#32156b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#ff9a72"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#a78bfa" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1280" cy="210" r="260" fill="#7c3aed" opacity=".18" filter="url(#blur)"/>
  <circle cx="1480" cy="690" r="230" fill="#fb7185" opacity=".13" filter="url(#blur)"/>
  <path d="M0 740C360 570 560 860 900 670S1300 420 1600 520" fill="none" stroke="url(#glow)" stroke-width="3"/>
  <path d="M0 790C350 620 610 900 940 720S1320 510 1600 600" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-width="2"/>

  <g transform="translate(92 76)">
