    <text y="215" fill="#ff9a72" font-family="Arial, sans-serif" font-size="48" font-weight="700">3ème édition</text>
    <text y="278" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="28" letter-spacing="2">DISCOVER. CHALLENGE. INNOVATE.</text>
  </g>

